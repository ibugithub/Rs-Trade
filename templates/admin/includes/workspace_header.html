<header id="rs-workspace-header">
    <a class="rs-workspace-brand" href="{% url 'admin:index' %}"><span>RS</span><strong>Trade<small>Operations</small></strong></a>
    <div class="rs-workspace-tools">
        {% include 'admin/includes/notifications.html' %}
        <details class="rs-account-menu">
            <summary aria-label="Account menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></summary>
            <div class="rs-account-menu__panel">
                <small>Signed in as</small><strong>{{ user.get_username }}</strong>
                {% if user.has_usable_password %}<a href="{% url 'admin:password_change' %}">Change password &rarr;</a>{% endif %}
                <form id="logout-form" method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button type="submit">Sign out &rarr;</button></form>
            </div>
        </details>
    </div>
</header>
